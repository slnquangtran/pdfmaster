[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfmaster"
version = "0.1.0"
description = "Comprehensive PDF suite for creation, editing, design, and conversion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PDF Master Team"}
]
keywords = ["pdf", "pdf-creation", "pdf-editing", "pdf-conversion", "pdf-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "reportlab>=4.0.0",
    "PyMuPDF>=1.23.0",
    "pypdf>=3.17.0",
    "pdfplumber>=0.10.0",
    "docx2pdf>=0.1.8",
    "weasyprint>=60.0",
    "click>=8.1.0",
    "Pillow>=10.0.0",
    "PyQt6>=6.0.0",
    "PyQt6-WebEngine>=6.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]
gui = [
    "PyQt6>=6.0.0",
]

[project.scripts]
pdfmaster = "pdfmaster.src.cli:main"
pdfmaster-gui = "pdfmaster.ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfmaster*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
